<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>再别康桥</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "SimSun", "Microsoft YaHei", serif;
            background-color: #f8f9fa;
            color: #333;
            padding: 40px 20px;
        }
        .poem-wrap {
            max-width: 620px;  /* 控制内容宽度，重点！不要太宽 */
            margin: 0 auto;    /* 整体居中 */
        }
        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 32px;
            font-weight: normal;
        }
        .poem p {
            text-align: center;  /* 诗句居中，适合这首诗 */
            font-size: 18px;
            line-height: 2.2;    /* 行高拉大，诗文不挤 */
            margin: 4px 0;
        }
        .back-btn {
            display: block;
            width: 140px;
            text-align: center;
            margin: 40px auto 0;
            padding: 10px;
            background: #4096ff;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }
        .back-btn:hover {
            background: #2b7ed8;
        }
    </style>
</head>
<body>
    <div class="poem-wrap">
        <h1>再别康桥</h1>
        <div class="poem">
            <p>轻轻的我走了，正如我轻轻的来；</p >
            <p>我轻轻的招手，作别西天的云彩。</p >
            <p>那河畔的金柳，是夕阳中的新娘；</p >
            <p>波光里的艳影，在我的心头荡漾。</p >
            <p>软泥上的青荇，油油的在水底招摇；</p >
            <p>在康河的柔波里，我甘心做一条水草！</p >
            <p>那榆荫下的一潭，不是清泉，是天上虹；</p >
            <p>揉碎在浮藻间，沉淀着彩虹似的梦。</p >
            <p>寻梦？撑一支长篙，向青草更青处漫溯；</p >
            <p>满载一船星辉，在星辉斑斓里放歌。</p >
            <p>但我不能放歌，悄悄是别离的笙箫；</p >
            <p>夏虫也为我沉默，沉默是今晚的康桥！</p >
            <p>悄悄的我走了，正如我悄悄的来；</p >
            <p>我挥一挥衣袖，不带走一片云彩。</p >
        </div>
        <a href="list.html " class="back-btn">返回首页</a >
    </div>
</body>
</html>
